# NOTE: qt6ui is intentionally EXCLUDED from the parent workspace
# (see ../../Cargo.toml).  It must be built with the `x86_64-pc-windows-gnu`
# toolchain against the MinGW Qt 6 kit, so it does not inherit the workspace's
# MSVC-oriented settings and defines its own lints/profiles.
[package]
name = "qt6ui"
version = "0.1.0"
edition = "2021"
description = "Minimal, low-RAM native Qt 6 (QML) client for mumble-protocol"
license = "MIT"

[[bin]]
name = "qt6ui"
path = "src/main.rs"

[dependencies]
# Qt bindings.
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml"] }

# Reused Fancy Mumble crates - all the client logic lives here, NOT in this UI.
mumble-protocol = { path = "../mumble-protocol", features = ["opus-codec"] }
fancy-audio-device = { path = "../fancy-audio-device" }
fancy-utils = { path = "../fancy-utils" }

# Async runtime that drives the protocol client + outbound audio encode loop.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }

# Only used to install the process-level CryptoProvider at startup (rustls
# cannot pick one automatically in this dependency graph, and the release
# profile aborts on panic); the actual TLS stack lives in mumble-protocol.
rustls = { version = "0.23", features = ["ring"] }

serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }

# Aggressively optimise for size + low runtime overhead, matching the
# "minimal RAM" goal.  A separate profile from the workspace so the MSVC
# workspace build is untouched.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "allow"          # cxx-qt bridge + cpal Send impls require unsafe FFI
missing_docs = "allow"
