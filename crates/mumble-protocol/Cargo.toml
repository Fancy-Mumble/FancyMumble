[package]
name = "mumble-protocol"
version = "0.4.0"
edition = "2021"
# Internal workspace crate - never published to crates.io (this also lets
# cargo-deny's wildcard gate exempt the path dependencies).
publish = false
description = "Async Mumble protocol client library with priority-based work queue"
license = "MIT"

[dependencies]
fancy-utils = { path = "../fancy-utils" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }

# TLS for Mumble TCP connection
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1.0.6"
rustls-pemfile = "2"

# Protobuf
prost = "0.14.3"
bytes = "1"

# Logging
tracing = "0.1"

# Error handling
thiserror = "2"

# Audio codec (C libopus via audiopus_sys - reliable, well-tested)
opus = { version = "0.3", optional = true }

# Pure-Rust port of Xiph's RNNoise (GRU-based noise suppression).
# Operates on 480-sample mono frames at 48 kHz - matches our pipeline.
nnnoiseless = { version = "0.5", default-features = false, optional = true }

# Real-valued FFT used by the classical spectral-subtraction denoiser
# backend.  Pure Rust, no_std-compatible, ~50 KiB.
realfft = "3"

# OMLSA + IMCRA "modern classical" denoiser is inlined in
# `src/audio/filter/denoiser/omlsa/`, so no external crate is required.

# DeepFilterNet deep-learning denoiser (Schroeter et al. 2023,
# arXiv:2305.08227).  Lives in its own crate to isolate the ONNX
# runtime and bundled model.
fancy-denoiser-deepfilter = { path = "../fancy-denoiser-deepfilter", optional = true }

# Voice encryption. OCB2-AES128 for every stock Mumble server;
# XChaCha20-Poly1305 for a Fancy server at 0.4.0 or later.
#
# Not optional, and deliberately so: announcing Fancy 0.4.0 is a promise about
# what this client can decrypt, and a build flag that changed the answer would
# make two builds of the same version behave differently on the wire.
aes = "0.8"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Persistent chat - key management
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
hmac = { version = "0.12", optional = true }
rand = { version = "0.10.0", optional = true }
rmp-serde = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = { version = "0.11", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
libloading = { version = "0.8", optional = true }

[features]
default = []
opus-codec = ["opus"]
# RNN-based noise suppression for the outbound audio pipeline.
# Adds ~130 KiB of code + a small embedded model (~85 KiB).
rnnoise-denoiser = ["nnnoiseless"]
# DeepFilterNet deep-learning denoiser (SOTA, ~+0.4 PESQ vs. RNNoise).
#
# Adds the embedded ONNX model plus the tract-onnx runtime. The model
# `default-model` embeds is `DeepFilterNet3_onnx.tar.gz`, which is
# **7.6 MiB** on disk, not the ~5 MiB this line claimed before anyone
# measured it. On by default for Windows in `mumble-tauri`; see the
# target block there for why that platform and not the rest.
#
# The published "+0.4 PESQ vs RNNoise" is a *perceptual* result on
# non-stationary noise. On stationary white noise a plain SNR measurement
# puts RNNoise ahead — see the table in
# `tests/denoiser_quality.rs`, which deliberately asserts no ranking.
deepfilternet-denoiser = ["fancy-denoiser-deepfilter"]
persistent-chat = [
    "x25519-dalek",
    "ed25519-dalek",
    "hmac",
    "rand",
    "rmp-serde",
    "uuid",
    "serde_bytes",
    "libloading",
]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "test-util"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
minimp3 = "0.6.1"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
rcgen = "0.13"
serde_json = "1"

[lints]
workspace = true

[build-dependencies]
prost-build = "0.14.3"
