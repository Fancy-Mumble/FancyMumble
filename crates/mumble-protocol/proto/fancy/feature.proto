syntax = "proto3";

// The remaining client-facing envelopes, one message set per service:
//
//   1004 voice   1005 text   1007 moderation   1010 plugins   1011 push
//   1012 audit   1014 onboarding   1016 link-preview   1017 context-actions
package starling.fancy.feature.v1;

import "fancy/wire.proto";

// -- 1004 voice -------------------------------------------------------------

message VoiceEnvelope {
  oneof body {
    ListenRequest listen = 1;
    ListenerVolume volume = 2;
    VoiceStats stats = 3;
    CipherNotice cipher = 4;
  }
}

// Hear a channel without joining it. Upstream carries listeners inside
// UserState; the volume adjustment has no upstream field at all.
message ListenRequest {
  repeated uint32 listen = 1;
  repeated uint32 unlisten = 2;
}

message ListenerVolume {
  uint32 channel = 1;
  float volume = 2;
}

message VoiceStats {
  uint32 session = 1;
  uint32 good = 2;
  uint32 late = 3;
  uint32 lost = 4;
  uint32 resync = 5;
  bool udp = 6;
}

// Which cipher the peer was given, so a client can show it rather than infer
// it from the shape of the key material.
message CipherNotice {
  string cipher = 1;
}

// -- 1005 text --------------------------------------------------------------

message TextEnvelope {
  oneof body {
    HistoryRequest history = 1;
    HistoryPage page = 2;
    Edit edit = 3;
    Delete delete = 4;
    Scheduled schedule = 5;
    ScheduleQuery query = 6;
    ScheduleList list = 7;
    ScheduleCancel cancel = 8;
    ScheduleAck ack = 9;
  }
}

message HistoryRequest {
  // Flat for the same reason pchat's is: routing and authorisation read it.
  uint32 channel = 1;
  starling.fancy.wire.v1.Cursor page = 2;
}

message StoredMessage {
  string message_id = 1;
  uint32 channel = 2;
  uint32 sender = 3;
  string sender_name = 4;
  string body = 5;
  uint64 sent_at_ms = 6;
  bool edited = 7;
}

message HistoryPage {
  uint32 channel = 1;
  repeated StoredMessage messages = 2;
  starling.fancy.wire.v1.PageInfo page = 3;
}

// Both of these named a message and no channel, which left the service unable
// to route or authorise one without first looking the id up. `MessageRef`
// carries the pair, and unlike the fan-out paths above nothing here reads the
// channel before the body is understood.
message Edit {
  starling.fancy.wire.v1.MessageRef target = 1;
  string body = 2;
}

message Delete {
  starling.fancy.wire.v1.MessageRef target = 1;
}

// -- Scheduled messages -----------------------------------------------------
//
// A message the server holds and posts to its channels at a future time. It
// lives under `text` because that is what it becomes: at the due time the
// server sends an ordinary `TextMessage`, subject to the same length limit,
// the same markup filter and the same history. murmur's is the same design at
// wire ids 161-165 (`Messages.cpp:5322`, `Server.cpp:2427`).

// What a scheduled message is doing.
enum ScheduleStatus {
  SCHEDULE_PENDING = 0;
  SCHEDULE_DELIVERED = 1;
  SCHEDULE_CANCELLED = 2;
  // Never stored: the schedule was refused, and the ack says why.
  SCHEDULE_REFUSED = 3;
}

// Client -> server to schedule; server -> client as the elements of a
// `ScheduleList`. Every identity and time field below the body is written by
// the server, so a client that fills one in changes nothing.
message Scheduled {
  // Assigned by the server. A client that sends one is ignored, because an id
  // a peer chooses is an id a peer can collide with somebody else's.
  string schedule_id = 1;
  // Where it goes. At least one channel or tree is required, and a tree means
  // the channel and everything under it, as `TextMessage.tree_id` does.
  repeated uint32 channels = 2;
  repeated uint32 trees = 3;
  string body = 4;
  uint64 deliver_at_ms = 5;
  // The creator's session when they scheduled it. Delivery attributes the
  // message to this session only if the same person is still connected, so it
  // is a display hint and never the owner.
  uint32 creator = 6;
  // The owner. A session id is per connection and recycled; only the
  // certificate still names the same person after a reconnect, which is what
  // "only the creator may cancel" has to mean.
  bytes creator_cert = 7;
  string creator_name = 8;
  uint64 created_at_ms = 9;
  ScheduleStatus status = 10;
}

// Client -> server: the caller's own scheduled messages.
message ScheduleQuery {
  // Include what has already been delivered or cancelled. Pending only by
  // default, which is what a "pending" panel shows.
  bool include_finished = 1;
}

// Server -> client: the answer to a `ScheduleQuery`.
message ScheduleList {
  repeated Scheduled messages = 1;
}

// Client -> server: cancel a pending message. Only its creator may.
message ScheduleCancel {
  string schedule_id = 1;
}

// Server -> client: the outcome of a schedule or a cancel.
message ScheduleAck {
  string schedule_id = 1;
  ScheduleStatus status = 2;
  // Why it was refused, in words a client can show. Empty otherwise.
  string reason = 3;
}

// -- 1007 moderation --------------------------------------------------------

message ModerationEnvelope {
  oneof body {
    BanEntry ban = 1;
    BanEntries bans = 2;
    Unban unban = 3;
    Refused refused = 4;
  }
}

message BanEntry {
  uint64 id = 1;
  string address = 2;
  uint32 prefix_len = 3;
  string name = 4;
  string hash = 5;
  string reason = 6;
  uint64 start_ms = 7;
  uint32 duration_s = 8;
}

message BanEntries {
  repeated BanEntry bans = 1;
}

message Unban {
  uint64 id = 1;
}

message Refused {
  string action = 1;
  starling.fancy.wire.v1.Refusal refusal = 2;
}

// -- 1010 plugins -----------------------------------------------------------

message PluginsEnvelope {
  oneof body {
    Registry registry = 1;
    RegistryQuery query = 2;
    Opaque opaque = 3;
    Admin admin = 4;
    AdminResult admin_result = 5;
  }
}

message PluginDescriptor {
  string id = 1;
  string name = 2;
  string version = 3;
  bool enabled = 4;
  // What the plugin says about itself, as JSON: description, author, tags, and
  // the client manifest a Fancy client renders its slash commands and settings
  // panels from.
  //
  // Opaque here, and it stays opaque: the server neither parses nor validates
  // it beyond checking that it *is* JSON and fits the size cap. Carried on the
  // descriptor because a registry without it tells a client a plugin exists and
  // nothing it would need to draw anything.
  //
  // Upstream's `PluginRegistryEntry` also carries a `plugin_slot`. Deliberately
  // absent: it is the index of the plugin among those currently loaded, so it
  // changes whenever anything is enabled or disabled. Clients key on `name`.
  string info_json = 5;
}

message Registry {
  repeated PluginDescriptor plugins = 1;
}

message RegistryQuery {}

// The server never learns what is inside. That is the whole opacity rule, and
// it is why this is `bytes` and not a oneof of plugin message types.
message Opaque {
  string plugin = 1;
  bytes payload = 2;
  repeated uint32 recipients = 3;
  uint32 sender = 4;
  // Which of the plugin's own message kinds this is, as the plugin names them
  // (`"friends.open"`, `"PluginActivated"`).
  //
  // Not a hole in the opacity rule, and worth being precise about why: the
  // server treats this as a string it copies, never as something it switches
  // on. A plugin needs it to tell one of its own messages from another, and
  // upstream's `PluginMessage` (wire 200) carries exactly this field for
  // exactly that reason. Without it every message a plugin receives is an
  // undifferentiated blob and the plugin has to invent its own framing inside
  // `payload` to get the field back.
  string payload_type = 5;
}

message Admin {
  enum Kind {
    ENABLE = 0;
    DISABLE = 1;
    INSTALL = 2;
    UNINSTALL = 3;
  }
  Kind kind = 1;
  string id = 2;
  string source_key = 3;
}

message AdminResult {
  bool ok = 1;
  string detail = 2;
}

// -- 1011 push --------------------------------------------------------------

message PushEnvelope {
  oneof body {
    Register register = 1;
    Unregister unregister = 2;
    Subscribe subscribe = 3;
    PushAck ack = 4;
    LiveSubscribe live_subscribe = 5;
  }
}

message Register {
  string token = 1;
  string platform = 2;
  // The channels to stay quiet about, as `Subscribe.muted`, carried here so a
  // device that has just registered is not loud until its first subscribe.
  repeated uint32 muted = 3;
}

message Unregister {
  string token = 1;
}

// Which channels a device wants *no* notification from.
//
// An exclusion list, and the direction matters. This was an inclusion list,
// `channels` plus an `all` flag, which is the wrong shape twice over: a user
// mutes two rooms out of forty and cannot be asked to enumerate the other
// thirty-eight, and any channel created after the list was sent would silently
// stop notifying. Muting is the thing a person does; being notified is the
// default they are changing.
//
// The whole set is replaced on every send, so a client can always say "I have
// forgotten that one", the same reason `permissions.TokenSet` replaces rather
// than adds.
message Subscribe {
  repeated uint32 muted = 1;
}

// "Send me messages from channels I am not in, while I am here."
//
// The fork's `FancySubscribePush` (wire 125), and a different feature from
// `Subscribe` above however alike the two look: that one is about a *device*
// that is asleep, this one is about a *session* that is connected. A subscriber
// is added to the recipients of a text message addressed at a channel they hold
// `SubscribePush` in, without joining it and without a listener. It is how a
// phone that is awake sees the room it has notifications for.
//
// Session-scoped, so it needs no account and dies with the connection --
// deliberately, since a subscription that outlived the session would belong to
// whoever inherits the session id.
//
// `muted` is an exclusion list, as everywhere else here: the channels to leave
// out of that delivery, and the whole set is replaced on every send.
message LiveSubscribe {
  repeated uint32 muted = 1;
}

message PushAck {
  bool ok = 1;
  string detail = 2;
}

// -- 1012 audit -------------------------------------------------------------

message AuditEnvelope {
  oneof body {
    Query query = 1;
    Page page = 2;
    Config config = 3;
    ConfigUpdate config_update = 4;
    Event event = 5;
    ConfigQuery config_query = 6;
    Verify verify = 7;
    VerifyResult verify_result = 8;
    SnapshotQuery snapshot_query = 9;
    ProfileSnapshot snapshot = 10;
  }
}

// Asks for the avatar or comment an `audit.profile` entry kept.
message SnapshotQuery {
  string entry_id = 1;
  string query_id = 2;
}

// What was kept. `found` is false once retention or `profile_history` has
// pruned it. A comment comes back decompressed; an avatar as the shrunk copy.
message ProfileSnapshot {
  string entry_id = 1;
  string query_id = 2;
  bool found = 3;
  // "avatar" or "comment".
  string kind = 4;
  string mime = 5;
  bytes body = 6;
  // The size of what the user sent, before it was shrunk or compressed.
  uint64 original_size = 7;
  // The size it is stored at.
  uint64 stored_size = 8;
}

// Asks for the Config below. Client-initiated rather than pushed after sync:
// the admin surface is opened long after the handshake, and a snapshot pushed
// at sync is one the client has to hold and invalidate for a tab most sessions
// never open.
message ConfigQuery {}

// Walk the chain and report the first link that does not hold.
//
// Separate from Query because it is not a search: it reads every row in the
// scope, so it is an explicit operator action behind its own button rather
// than something a filter change can trigger.
message Verify {
  // Echoed on VerifyResult, for the reason Query.query_id exists.
  string query_id = 1;
}

message VerifyResult {
  bool intact = 1;
  // How many links held. On a break this is where the walk stopped, which is
  // the entry *before* the tampered one.
  uint64 checked = 2;
  // The first entry whose link does not hold, empty when intact.
  string broken_at = 3;
  // The `Verify.query_id` this answers.
  string query_id = 4;
}

message Query {
  uint64 since_ms = 1;
  uint64 until_ms = 2;
  string category = 3;
  starling.fancy.wire.v1.Cursor page = 4;
  // Narrow to what was done to one account. Indexed
  // (`ix_audit_target`), which is why this is offered as a filter and
  // `target_channel` below is not: a filter that table-scans the log is a
  // way to make the server slow from a chat window.
  uint64 target_account = 5;
  // Echoed on the reply. A client shows one audit tab but a filter change and
  // a page-down are two queries in flight, and without a correlation id the
  // slower one's page overwrites the newer one's. Same reason
  // `PreviewRequest.request_id` exists.
  string query_id = 6;
}

message AuditRecord {
  string id = 1;
  uint64 at_ms = 2;
  string category = 3;
  string action = 4;
  string actor = 5;
  string detail = 6;
  string entry_hash = 7;
  // Who and where it was done to. The store has held both since it existed and
  // the record dropped them, so "banned" arrived without saying whom, and a
  // reader had to parse `detail` (prose written for a human) to find out.
  uint64 target_account = 8;
  uint32 target_channel = 9;
  // A stored avatar or comment can be fetched with SnapshotQuery.
  bool has_snapshot = 10;
}

message Page {
  repeated AuditRecord records = 1;
  starling.fancy.wire.v1.PageInfo page = 2;
  // The `Query.query_id` this answers.
  string query_id = 3;
}

message Config {
  bool enabled = 1;
  repeated string categories = 2;
  uint32 retention_days = 3;
  // How many entries the chain holds, for the config half's chain-status card.
  // Sent with the config so the card can render a height before anybody asks
  // for a verify, which is the expensive part.
  uint64 chain_height = 4;
  // Past avatars and comments kept per user; zero records none.
  uint32 profile_history = 5;
}

message ConfigUpdate {
  Config config = 1;
}

// Pushed live to an admin watching the log, rather than polled.
message Event {
  AuditRecord record = 1;
}

// -- 1014 onboarding --------------------------------------------------------

message OnboardingEnvelope {
  oneof body {
    Flow flow = 1;
    FlowQuery query = 2;
    Response response = 3;
    FlowUpdate update = 4;
  }
}

message Step {
  string id = 1;
  string title = 2;
  string body = 3;
  enum Kind {
    INFO = 0;
    CONSENT = 1;
    CHOICE = 2;
    TEXT = 3;
  }
  Kind kind = 4;
  bool required = 5;
  repeated Choice choices = 6;
  // Asked before the user may enter a channel at all, rather than at leisure
  // afterwards. murmur has no such gate, so a stock client never sees one.
  bool before_join = 7;
  bool multi_select = 8;

  // One selectable answer, and what choosing it grants.
  //
  // The grants are the feature. An onboarding answer is not a survey datum: it
  // is a request for channel visibility and group membership that the server
  // applies on submission, which is why a shape carrying only a label would
  // make the whole questionnaire decorative.
  message Choice {
    string id = 1;
    string label = 2;
    string description = 3;
    // Rendered beside the label. A Unicode grapheme cluster, deliberately not
    // `wire.Emoji`, because a server shortcode would have to resolve against a
    // custom-emoji set the onboarding flow is shown before the client has.
    string emoji = 4;
    // Channels this answer reveals to the user...
    repeated uint32 channels = 5;
    // ...and the ACL groups it joins them to.
    repeated string groups = 6;
  }
}

message Flow {
  string flow_id = 1;
  repeated Step steps = 2;
  uint64 version = 3;
  // Off means no client shows the flow. Kept rather than deleting the flow, so
  // an operator can turn it off without losing what they wrote.
  bool enabled = 4;
  // Granted to everyone who arrives, whatever they answer.
  repeated uint32 default_channels = 5;
  // Who last changed it, and when. Server-filled; ignored as input.
  string updated_by = 6;
  uint64 updated_at_ms = 7;
}

message FlowQuery {
  // Also send back this user's own stored answers.
  bool include_answers = 1;
}

message Response {
  string flow_id = 1;
  repeated Answer answers = 2;
  // The flow version these answers were given against. What decides whether to
  // ask again: an admin who adds a question has a flow nobody has answered,
  // and without this the server cannot tell that from everybody having.
  uint64 flow_version = 3;
  // Server-filled. **Zero means nothing is stored**, the reply to a query from
  // a user who has never answered, which is a different thing from a user who
  // answered and chose nothing.
  uint64 submitted_at_ms = 4;

  message Answer {
    string step_id = 1;
    // The `Choice.id`s picked. A TEXT step carries `text` instead.
    repeated string choice_ids = 2;
    string text = 3;
  }
}

message FlowUpdate {
  Flow flow = 1;
}

// -- 1016 link-preview ------------------------------------------------------

message LinkPreviewEnvelope {
  oneof body {
    PreviewRequest request = 1;
    Preview preview = 2;
    PreviewError error = 3;
  }
}

// "Preview these links for me."
//
// **Several URLs, one request.** A chat message carries as many links as
// somebody typed, and a canon that took one per request would have the client
// either send N frames (through a rate limiter that counts frames) or drop
// all but the first, which is what the epoch-0 translation did.
//
// The answers come back one `Preview` (or `PreviewError`) per URL, each
// carrying the `request_id` and its own `url`, so a client can render them as
// they arrive rather than waiting for the slowest host in the message.
message PreviewRequest {
  string request_id = 1;
  repeated string urls = 2;
}

// Fetched by the server, never by the client, so a chat link cannot be used to
// probe a viewer's network. The fetch is SSRF-guarded on the server side.
//
// The picture travels the same way and for the same reason. `image` carries the
// bytes themselves, fetched and downscaled here, because the alternative -
// naming the origin's URL and letting each viewer load it - hands that origin
// one request per member of the channel, which is the probe the whole service
// exists to prevent. It is a thumbnail and not the original: a preview is a
// card in a chat log, and the megabyte behind an `og:image` buys nothing at
// that size while every recipient pays for it.
message Preview {
  string request_id = 1;
  string url = 2;
  string title = 3;
  string description = 4;
  // Reserved for a full-resolution image held by the files service, which
  // nothing stores yet. `image` below is the thumbnail every client renders.
  string image_key = 5;
  string site = 6;
  // The downscaled preview image, empty when the page offered none, when the
  // fetch failed, or when the operator has switched images off.
  bytes image = 7;
  // The MIME type of `image` (`image/jpeg`), empty when `image` is.
  string image_mime = 8;
  // The size of `image` itself, not of the original the page pointed at.
  uint32 image_width = 9;
  uint32 image_height = 10;

  // What the crawler decided the link *is*.
  //
  // A card for a video, a shop listing and a forum thread are three different
  // drawings, and the client cannot tell them apart from a title and a
  // picture. The server has the page in front of it - `og:type`, the Twitter
  // card, the content type the host served - so it is the one that can say,
  // and saying it once here keeps every client from growing its own table of
  // hosts it recognises.
  //
  // `PAGE` is the honest "nothing in particular", not a failure: most links
  // are a page with a title and a picture, and that is a card too.
  enum Kind {
    PAGE = 0;
    ARTICLE = 1;
    VIDEO = 2;
    // The link is a picture: either the URL served an image, or the page said
    // its subject was one. The `image` field is the work itself here rather
    // than a card the publisher drew for sharing, which is why a client may
    // show it whole instead of cropping it to a banner.
    IMAGE = 3;
    AUDIO = 4;
    // Something for sale, so `price` is set.
    PRODUCT = 5;
    // A thread rather than an article: a post somebody replied to.
    FORUM = 6;
    // A person or an account.
    PROFILE = 7;
  }
  Kind kind = 11;

  // Who made it: a channel, a byline, an artist. Empty where the page named
  // nobody.
  string author = 12;

  // Playing time, for `VIDEO` and `AUDIO`. Zero where the page named none.
  //
  // Seconds rather than a formatted string: "1:00:14" is a rendering, and the
  // client is the half of this that knows which locale it is drawing in.
  uint32 duration_seconds = 13;

  // What the *page* said its picture measures, before the server shrank it.
  //
  // `image_width`/`image_height` describe the bytes that travel, which are
  // capped at the thumbnail edge; these describe the original. A client lays
  // out a 360x253 thumbnail differently from a 3000x2000 photograph shrunk to
  // the same box - one may not be enlarged, the other may be cropped to a
  // band - and after the downscale that difference is no longer visible in
  // the bytes. Zero where the page did not say and the server did not fetch
  // the picture.
  uint32 source_width = 14;
  uint32 source_height = 15;

  // What it costs, for `PRODUCT`.
  message Price {
    // The number, as the page wrote it, normalised to a `.` decimal point.
    // A string rather than a number because a price is a decimal amount and
    // a float is not, and because the client only ever prints it.
    string amount = 1;
    // ISO 4217 where the page named one ("EUR"), empty where it did not.
    string currency = 2;
    // What it cost before, for a page that advertises a reduction. Empty
    // where the page named no earlier price.
    string was = 3;
    // `og:availability` as the page wrote it: "instock", "oos",
    // "preorder". Empty where the page said nothing.
    string availability = 4;
  }
  Price price = 16;

  // The labelled facts a page published about itself, in the order it gave
  // them.
  //
  // Pages state these in `twitter:label1`/`twitter:data1` pairs - a shop puts
  // the price and the stock there, a forum the reply count, a code host the
  // language - and the set is open, so this carries them as they came rather
  // than as a fixed list of fields nobody can extend. `key` is the crawler's
  // reading of `label` where it recognised one, so a client can draw the
  // handful it has a shape for (an arrow for a score, a bubble for a comment
  // count) and print the rest as they stand.
  message Fact {
    // Canonical and lowercase - "score", "comments", "replies", "likes",
    // "views", "price", "availability", "shipping", "sellers", "rating" -
    // or empty where the label was not one the crawler knows.
    string key = 1;
    // The label the page wrote ("Reply count").
    string label = 2;
    // The value the page wrote ("206").
    string value = 3;
  }
  repeated Fact facts = 17;

  // The site's own icon, fetched and shrunk here like the picture is, and for
  // the same reason: a client that loaded a favicon from the origin would
  // hand that origin one request per member of the channel, which is the
  // probe server-side previews exist to prevent. Empty where the page
  // declared none, where the fetch failed, or where the operator has switched
  // images off.
  bytes icon = 18;
  // The MIME type of `icon`, empty when `icon` is.
  string icon_mime = 19;

  // When the page says it was published, as it wrote it - ISO-8601 on every
  // page that uses a vocabulary for it, and whatever a hand-written
  // `<meta name="date">` contained on the ones that do not. Not normalised
  // here: a date the server could not parse is still worth showing, and the
  // client is the half of this that knows the reader's locale.
  string published_at = 20;
  // What the page says its content is: "safe", "general", "mature",
  // "explicit", "adult". Lowercased, otherwise as written - the vocabularies
  // disagree and no scale maps onto another, so this is a label to print and
  // a hint to blur behind, not a number to compare.
  string content_rating = 21;
}

message PreviewError {
  string request_id = 1;
  string reason = 2;
}

// -- 1017 context-actions ---------------------------------------------------

message ContextActionsEnvelope {
  oneof body {
    Action action = 1;
    Menu menu = 2;
  }
}

// The Fancy half of upstream's ContextAction (17): an action a plugin added,
// carrying which plugin owns it so the trigger routes back without the server
// knowing what it does.
message Action {
  string action = 1;
  string plugin = 2;
  uint32 session = 3;
  uint32 channel = 4;
}

message MenuEntry {
  string action = 1;
  string text = 2;
  string plugin = 3;
  uint32 context = 4;
}

message Menu {
  repeated MenuEntry entries = 1;
  repeated string removed = 2;
}
