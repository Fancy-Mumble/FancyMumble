[package]
name = "mumble-tauri"
version = "0.3.0"
edition = "2021"
# Internal workspace crate - never published to crates.io (this also lets
# cargo-deny's wildcard gate exempt the path dependencies).
publish = false
description = "Tauri desktop & mobile GUI for mumble-protocol"
license = "MIT"

[lib]
name = "mumble_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mumble-tauri"
path = "src/main.rs"

[features]
default = ["self-updater"]
# The bundled auto-updater: checks GitHub releases on launch, and can download
# and swap the binary in place. On by default, because that is how the .deb,
# the AppImage and the Windows installer are expected to behave.
#
# Turn it OFF for any build whose updates are somebody else's job - Flathub
# above all, where a self-updating app is both against the submission rules and
# impossible against a read-only /app. Distro packages (AUR, deb repos) want it
# off for the same reason.
#
#   cargo build --release --no-default-features --features custom-protocol
#
# Dropping it takes `updater/{commands,manager}.rs`, the six `updater_*`
# commands and both plugins out of the binary, and build.rs stops feeding
# `capabilities/self-updater/` to the ACL so the now-absent `updater:` and
# `process:` permissions are not referenced. What stays is the window plumbing
# in `updater/window.rs` (`MAIN_WINDOW_LABEL`, `show_main_window`), which the
# rest of the app uses to reveal the main window on launch.
self-updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
deepfilternet-denoiser = ["mumble-protocol/deepfilternet-denoiser"]
# Production asset mode: serve the embedded `ui/dist` via the custom Tauri
# protocol instead of loading `devUrl` (localhost:1420). The Tauri CLI enables
# this automatically for `cargo tauri build`; define it here so a plain
# `cargo build/run --features custom-protocol` also produces a standalone
# binary that needs no running vite dev server (e.g. for profiling).
custom-protocol = ["tauri/custom-protocol"]
# Webview devtools (F12 + right-click "Inspect Element"). Auto-enabled in debug
# builds, but NOT in optimized profiles like `release-debug`, so expose it as a
# feature to opt in when profiling an optimized build.
devtools = ["tauri/devtools"]
# Heap profiling: replaces the global allocator with dhat's profiling
# allocator and writes `dhat-heap.json` on exit (view at
# https://nnethercote.github.io/dh_view/dh_view.html). Mutually exclusive
# with mimalloc at runtime; the dhat allocator takes priority when enabled.
dhat-heap = ["dep:dhat"]

[dependencies]
fancy-utils = { path = "../fancy-utils" }
tauri = { version = "2.10.1", features = [
    "protocol-asset",
    "tray-icon",
    "image-png",
] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "time",
] }
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.14.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
ring = "0.17"
arc-swap = "1"
base64 = "0.22"
prost = "0.14"
zstd = "0.13"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "multipart",
    "stream",
    "json",
] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
hound = "3.5"
chrono = "0.4"
mp4 = "0.14"
openh264 = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Desktop-only dependencies (cpal, global shortcuts, and Opus are not available on Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
# Compacting allocator that returns freed pages to the OS far more
# aggressively than the Windows system heap, which otherwise holds the
# startup high-water mark (~280 MB) for the whole process lifetime.
mimalloc = { version = "0.1", default-features = false }
# Optional heap profiler, enabled only via the `dhat-heap` feature.
dhat = { version = "0.3", optional = true }
png = "0.18"
mumble-protocol = { path = "../mumble-protocol", features = [
    "opus-codec",
    "persistent-chat",
    "rnnoise-denoiser",
] }
cpal = "0.17.3"
# Screen sharing core (source enumeration, capture, encode, WebRTC broadcast).
fancy-screenshare = { path = "../fancy-screenshare" }
# Discord Rich Presence listener. Desktop only: it hosts the Discord IPC
# endpoint (Unix socket / named pipe), which has no Android equivalent.
fancy-presence = { path = "../fancy-presence" }
rodio = { version = "0.22", features = ["recording"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
# Auto-updater (desktop only). All updater logic lives in `src/updater/`.
# Optional so a distro/Flathub build can drop it - see the `self-updater`
# feature above. `process` is only here for the bootstrapper's relaunch, so it
# is gated by the same feature.
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
# Android: mumble-protocol with Opus codec + oboe for native audio I/O.
[target.'cfg(target_os = "android")'.dependencies]
mumble-protocol = { path = "../mumble-protocol", features = [
    "opus-codec",
    "persistent-chat",
    "rnnoise-denoiser",
] }
oboe = "0.6.1"

# Windows-only: native window subclassing for aspect-ratio constraints
# (see crates/mumble-tauri/src/platform/window/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
# Native WASAPI capture with exclusive-mode support (the "take the device"
# path used by the exclusive-input setting), shared with the Qt client.
fancy-audio-device = { path = "../fancy-audio-device" }
# DeepFilterNet3 on Windows, on top of the features the desktop block above
# already asks for - cargo unions the two, so this adds the backend rather
# than replacing the set.
#
# Windows only, deliberately. It costs ~5 MiB of embedded ONNX model plus the
# `tract` runtime in the binary, and this is the platform where the shipped
# builds have the headroom for it. `NoiseSuppressionAlgorithm::is_available`
# already reports per-build availability and the UI dropdown is populated from
# it, so a platform without the feature offers RNNoise and never shows a
# choice it cannot honour.
mumble-protocol = { path = "../mumble-protocol", features = [
    "deepfilternet-denoiser",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
# WebView2 COM bindings for ICoreWebView2_19::SetMemoryUsageTargetLevel
# (trim browser memory while minimized).  Versions must match the ones
# tauri/wry pull in so the COM interface types are identical.
webview2-com = "0.38"
windows-core = "0.61"

# macOS-only: NSWindow.setContentAspectRatio: for native aspect-ratio
# constraints (see crates/mumble-tauri/src/platform/window/macos.rs).
# objc2-foundation gives us NSRect / NSSize; we send AppKit messages
# through raw `AnyObject` pointers so objc2-app-kit is not needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }

# Linux-only: gtk_window_set_geometry_hints for native aspect-ratio
# constraints (see crates/mumble-tauri/src/platform/window/linux.rs).
# The gtk version must match the one tao/tauri pulls in (0.18).
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "macos", target_os = "ios"))))'.dependencies]
gtk = { version = "0.18", default-features = false }

# Linux-only: flip WebKitGTK's enable-webrtc / enable-media-stream settings on
# (they default to OFF and wry never sets them - without this the webview has
# no RTCPeerConnection and stream viewing cannot work; see app/webview_linux.rs).
# Same crate/version line wry uses; v2_38 gates the set_enable_webrtc binding.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.1", features = ["v2_38"] }
# Same version the notification plugin uses; see event_handler.rs for why
# Linux notifications bypass the plugin.
notify-rust = "4"
# Direct ALSA access for the PipeWire device layer (`audio/pipewire.rs`).
# cpal's ALSA host can only open the PCMs it finds in ALSA's hint list, and
# the per-node PCM this needs - `pipewire:NODE=<name>` - is not one of them.
# Already in the tree as a cpal dependency, so this adds no new system
# requirement beyond the libasound headers cpal already needs.
alsa = "0.11"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
serde_json = "1"
