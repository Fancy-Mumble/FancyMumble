[workspace]
resolver = "2"
members = [
    "crates/fancy-utils",
    "crates/fancy-denoiser-deepfilter",
    "crates/mumble-protocol",
    "crates/fancy-audio-device",
    "crates/fancy-screenshare",
    "crates/fancy-presence",
    "crates/mumble-tauri",
]
# The Mumble server-side plugin host crates (mumble-plugin-api, mumble-file-server,
# mumble-plugin-host) live in the mumble-server repository under
# 3rdparty/mumble-plugin-host/. They are not built from this workspace.
# signal-bridge is excluded because it depends on AGPL-licensed
# libsignal-protocol and is built separately as a dynamic library.
#
# qt6ui is excluded because it must be built with the `x86_64-pc-windows-gnu`
# toolchain against the MinGW Qt 6 kit (MSVC and MinGW have incompatible C++
# ABIs), so it cannot participate in the default MSVC workspace build.  It
# path-depends on the workspace crates and is built on its own - see
# crates/qt6ui/README.md.
exclude = ["crates/signal-bridge", "crates/qt6ui"]

# -- Workspace-wide lints --------------------------------------------
# These apply to every crate in the workspace automatically.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_crate_dependencies = "warn"
unused_results = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Lint groups - use lower priority so individual overrides take effect.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Individual style / pedantic lints (default priority 0 overrides groups)
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"
missing_errors_doc = "allow"         # too noisy for early development
module_name_repetitions = "allow"    # common pattern in Rust
unwrap_used = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "deny"
collapsible_else_if = "deny"
expect_used = "warn"

# -- Release profile optimizations -----------------------------------
[profile.release]
lto = "thin"              # Link-Time Optimization (thin = fast builds, good codegen)
codegen-units = 1         # Single codegen unit for maximum optimization
opt-level = 3             # Full optimizations
strip = "symbols"         # Strip debug symbols from the binary
panic = "abort"           # Abort on panic (smaller binary, no unwind overhead)

# -- Dev-profile overrides for frame-hot crates ----------------------
# `cargo tauri dev` compiles everything unoptimized, which makes the
# per-frame video path (camera/screen convert, downscale, H.264 encode)
# 10x+ slower than release - cameras crawl at a few fps in dev for no
# code reason. Optimizing just these leaf crates keeps app rebuilds fast
# while dev video behaves like release.
[profile.dev.package.fancy-screenshare]
opt-level = 3
# No incremental for THIS crate: opt-level 3 + incremental intermittently
# mixed codegen sessions inside the rlib (undefined hidden `.llvm.*`
# symbols at link time, failing every other rebuild once the crate started
# being edited frequently). Incremental reuse is near-zero at opt-level 3
# anyway; codegen stays fully parallel, and the crate only rebuilds when
# its own files change.
incremental = false
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.nokhwa]
opt-level = 3
[profile.dev.package.nokhwa-core]
opt-level = 3

# -- Dev-profile overrides for the audio pipeline ---------------------
# The outbound path runs 50 frames a second for as long as a microphone is
# open, whether or not anyone is speaking: capture, RNNoise, gain, gate, and
# an Opus encode for every frame that is not silence. `nnnoiseless` is a
# pure-Rust GRU and `audiopus_sys` is C that the `cc` crate compiles at the
# profile's own opt-level, so at 0 both run an order of magnitude slower than
# shipped - enough that sitting idle in a voice channel costs more CPU under
# `cargo tauri dev` than everything else the app does put together.
#
# These are third-party leaves: they never change, so optimizing them costs
# one build and nothing afterwards.
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.opus]
opt-level = 3
[profile.dev.package.audiopus_sys]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
# The frame maths around them - RMS, gain, the gate, format conversion - is
# per-sample loops in our own crate. Held at 2 rather than 3 deliberately:
# it is a crate that gets edited, and 2 buys most of the speed for a fraction
# of the compile time.
[profile.dev.package.mumble-protocol]
opt-level = 2

# -- Release + debug-info profile (for profiling) --------------------
# Fully optimized like `release`, but keeps debug symbols so heap/CPU
# profilers (dhat via `--features dhat-heap`, perf, VTune, Superluminal)
# can attribute samples to real function names and line numbers.
# Build with:  cargo build --profile release-debug
# Artifacts land in `target/release-debug/`.
[profile.release-debug]
inherits = "release"
# Profiling/iteration build: optimized enough to mirror release memory
# behaviour, but tuned for FAST builds (the retained heap we profile is the
# same at any opt level). Overrides release's fat LTO + codegen-units = 1,
# which together cost ~30 min for no profiling benefit.
lto = false               # no LTO - the single biggest build-time win
codegen-units = 256       # parallel codegen
debug = true              # full debug info so dhat/perf symbolicate stacks
strip = false             # keep symbols
split-debuginfo = "packed"

# -- Patched dependencies ---------------------------------------------------
# cros-libva 0.0.12 (and 0.0.13, which has the identical bug) cannot be built
# against libva >= 1.23. That release added `seg_id_block_size` and
# `va_reserved8` to VAEncPictureParameterBufferVP9, and the crate's own
# constructor initialises neither, so bindgen produces a struct the crate then
# fails to build. Ubuntu 26.04 ships libva 1.23, where the published crate
# simply does not compile.
#
# Our fork is 0.0.12 with those two fields added behind a
# `libva_1_23_or_higher` cfg its build.rs now emits, so it still builds
# unchanged against older libva. Drop this once upstream supports 1.23.
#
# A fork rather than a vendored tree: the patch is two files against an
# upstream tag, and as a fork it stays visibly that -- one commit anybody can
# read, rebase onto a later release, or send upstream. Vendored, it was seven
# thousand lines of third-party BSD code in this repo with the actual change
# invisible inside it.
[patch.crates-io]
cros-libva = { git = "https://github.com/Fancy-Mumble/cros-libva", branch = "fancy/libva-1.23" }
