# NOTE: fancy-gpui is intentionally EXCLUDED from the parent workspace (see
# ../../../Cargo.toml), like qt6ui: GPUI brings a few hundred crates of its
# own, and resolving them together with Tauri's would let either UI move the
# other's dependency versions. It keeps its own lockfile and repeats the
# workspace lints below.
[package]
name = "fancy-gpui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native GPUI view for Fancy Mumble: small memory and CPU footprint"
license = "MIT"

# The view is a library, so the Android package (`android-client` in
# Fancy-Mumble/fancy-android) runs the same code the desktop program does.
[lib]
name = "fancy_gpui"
path = "src/lib.rs"

# Only starts the library: its tests are the library's.
[[bin]]
name = "fancy-gpui"
path = "src/main.rs"
test = false

[features]
default = ["wayland", "x11"]
# The two Linux window systems, as GPUI names them. Both by default; a build
# for one leaves the other's client code out. Either one links
# libxkbcommon-x11 (Debian: libxkbcommon-x11-dev).
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
# `windows-manifest` embeds the Common Controls v6 manifest (and per-monitor
# DPI awareness): without it Windows loads comctl32 v5.82, which lacks the
# `TaskDialogIndirect` GPUI imports, and the exe dies at load with
# STATUS_ENTRYPOINT_NOT_FOUND. It does nothing on other platforms.
#
# GPUI as gpui-fast carries it (Zed's GPUI with a retained mode, window
# composition and dynamic textures), with Fancy Mumble's own changes on top
# (a blur of what is behind an element, `Window::set_bounds`, overlay
# windows, the Android platform): Fancy-Mumble/gpui, branch `develop`, whose
# FANCY_CHANGES.md lists them; Cargo.lock holds the commit. To work on GPUI
# beside the client, override it with a local checkout in
# `.cargo/config.toml` (`[patch."https://github.com/Fancy-Mumble/gpui"]`).
gpui = { git = "https://github.com/Fancy-Mumble/gpui", branch = "develop", default-features = false, features = ["font-kit", "windows-manifest", "layout-rounding-0-2"] }
# The engine. Still inside the Tauri package, built here without the Tauri
# view (`default-features = false`), so none of Tauri is compiled or linked.
mumble-tauri = { path = "../tauri", default-features = false, features = ["logs"] }
# The engine's background work runs on a runtime the view owns.
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# The engine reports to the view over a channel the UI thread can await.
async-channel = "2"
# Pictures pasted into a message arrive as base64 `data:` URIs.
base64 = "0.22"
# Scaling a chosen picture down to an avatar. The version GPUI already builds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Reads a JPEG at a half, a quarter or an eighth of its size without
# decoding all of it first: a photograph is shown far smaller than it is
# taken (`src/pictures/scaled.rs`). One thread: what it reads is small.
jpeg-decoder = { version = "0.3", default-features = false }
# Local time, for the clock beside a message and the rule between days.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The theme table (assets/themes.json) is generated from the web UI's
# catalogue and read once at startup.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reading a link apart: whether it is a picture or a YouTube video, and
# where it goes. The crate and release the engine already builds.
url = "2"
# Unicode's table of emoji: each with its name, its group and the shortcodes
# people type. The picker lists and finds them by it.
emojis = "0.9"
# The view says what it does into the same log the engine writes.
tracing = "0.1"
# Plays the sounds that say something happened (`src/sounds.rs`). The crate
# and the release the engine already builds for the microphone.
rodio = "0.22"
# The words in other languages (`src/words/`): this client's own files and
# the web client's, compiled in. The crate GPUI already builds.
rust-embed = { version = "8", features = ["include-exclude"] }
# Which plural form a count takes in a language: Unicode's rules, from the
# ICU4X family the URL parser already builds.
icu_plurals = "2.4"
icu_locale_core = "2.4"
# Reading the HTML a server or a user writes (a welcome, a description, a
# bio) as a browser does (`src/page/`). The releases Tauri's build already
# compiles; nothing new is fetched.
html5ever = "=0.39.0"
cssparser = "=0.37.0"
# A picture such a document carries as SVG, drawn once at the size it is
# shown into an ordinary picture. The release GPUI draws its icons with.
resvg = { version = "=0.45.1", default-features = false }
# The outlines of a few letters, for the marks a drawn theme sets as shapes
# rather than as text: a word hollowed to an outline, a word turned on its
# side (`src/ui/kit/lettering.rs`). The release resvg already builds.
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "variable-fonts", "opentype-layout"] }
# Set as a browser sets them: shaped, kerned, and a letter the face lacks
# from a system face that has it. The releases usvg already builds.
rustybuzz = "=0.20.1"
fontdb = { version = "=0.23.0", default-features = false, features = ["std", "fs", "memmap"] }
# A letter's overlapping parts (a stem and a diagonal drawn as two shapes)
# merged into one outline before it is stroked. The boolean operations
# `geo` uses; four small crates, nothing else.
i_overlay = "=9.1.0"
# Twelve characters nobody has to think up for a link's password, from the
# system's own randomness. The release GPUI's `rand` already builds.
getrandom = "=0.3.4"
# Screen sharing (`src/share/`): the web client's own capture, encoder and
# WebRTC peers, used as they are. Nothing of it runs until a share is
# started or watched.
# Decoding a watched share to pixels, and scaling them to the room they are
# shown in: the releases that crate already builds.
openh264 = "0.8"
fast_image_resize = "5"
# A share's sound comes as Opus: the made-up shares encode and decode a
# tone through it as a real share's sound comes. The release that crate
# already builds.
opus = "0.3"
# The QR code an authenticator scans to enrol a second factor (Settings,
# Account); the encoder alone, drawn through the kit's picture path.
qrcode = { version = "0.14", default-features = false }

# Screen sharing's capture, encoder and peers: not on Android, where the
# crate does not build (its capture library has no Android support);
# `src/share/real_absent.rs` stands in there.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The desktop platforms (`gpui_platform` picks this system's); on Android
# the package that loads the view brings gpui_mobile's instead
# (`android-client` in Fancy-Mumble/fancy-android).
gpui_platform = { git = "https://github.com/Fancy-Mumble/gpui", branch = "develop", default-features = false, features = ["font-kit"] }
fancy-screenshare = { path = "../../crates/fancy-screenshare" }

# System notifications, where there is no `notify-send` to hand them to.
# Linux keeps `notify-send`, which links no D-Bus stack into the view.
# Held at the release the web client builds: it speaks to Windows through
# the `windows` crate GPUI already builds, where a newer one brings a third
# copy of that crate for a toast.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
notify-rust = { version = "=4.12.0", default-features = false }

# The call that gives memory not in use back to the system (`src/trim.rs`),
# and the player's few calls (`src/player/composed.rs`). The bindings GPUI
# already builds.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Com"]

# Keys that work while another program has the keyboard (`src/hotkeys.rs`).
# The crate and the release the web client builds.
[target.'cfg(windows)'.dependencies]
global-hotkey = "=0.7.0"
# The icon in the system's tray, and its menu (`src/tray.rs`). The crate and
# the release the web client builds; its Linux part needs GTK.
tray-icon = { version = "=0.21.3", default-features = false }
# A video played in place, over its card (`src/player/`): WebView2, made
# only when play is pressed and drawn into the window's composition. The
# release Fancy-Mumble/gpui's own example of that builds (windows 0.62, as GPUI's
# surfaces are); the window's handle to make it in.
webview2-com = "0.39"
raw-window-handle = "0.6"

# Compiles the executable's icon into it (build.rs). The version GPUI
# already builds its manifest with.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The table of permissions the engine and the web client are written from,
# to hold this client's own against.
fancy-utils = { path = "../../crates/fancy-utils" }
# Drives the views without a display: simulated clicks and keys.
gpui = { git = "https://github.com/Fancy-Mumble/gpui", branch = "develop", default-features = false, features = ["test-support"] }
gpui_platform = { git = "https://github.com/Fancy-Mumble/gpui", branch = "develop", default-features = false, features = ["test-support"] }
# The one-time codes a live test of the Account page computes as an
# authenticator would (RFC 6238); all three already built for the engine.
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"

# What Fancy-Mumble/gpui's own workspace patches, repeated: a patch applies only from
# the manifest at the root of a build. Zed's copies of these crates.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop" }
# libva 2.23 added two VP9 fields that cros-libva 0.0.12 does not fill in;
# the same fork the workspace patches in.
cros-libva = { git = "https://github.com/Fancy-Mumble/cros-libva", branch = "fancy/libva-1.23" }

# Debug information for this package only. With it for all seven hundred
# dependencies as well, a debug build is tens of gigabytes on disk.
[profile.dev.package."*"]
debug = false

# Small and quick to start rather than fastest: the view is idle almost all
# of the time, and what it costs at rest is memory.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The workspace's lints, repeated because an excluded package inherits none.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_results = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
uninlined_format_args = "warn"
doc_markdown = "warn"
unwrap_used = "deny"
excessive_nesting = "deny"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "deny"
collapsible_else_if = "deny"
expect_used = "warn"
